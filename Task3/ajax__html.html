<!DOCTYPE html>
<html>
<head>
    <title>Student Info System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: white;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            background: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 20px;
            transition: 0.3s;
        }

        button:hover {
            background: #333;
            color: white;
        }

        #result {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 220px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-align: left;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .title {
            font-weight: bold;
            color: #4facfe;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

<h2>🎓 Student Information System</h2>

<button onclick="loadData()">Load Students</button>

<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
